<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0907">
<title>Barbearia · Área do cliente</title>
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="boot" class="boot"><img src="../assets/img/logo.png" alt="" onerror="this.remove()"><p>Carregando…</p></div>

<!-- Login e cadastro -->
<div id="auth" hidden>
  <main class="wrap">
    <a class="logo" href="../"><img src="../assets/img/logo.png" alt="Barbearia" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'BARBEARIA'}))"></a>
    <p class="muted center">Entre ou crie sua conta para agendar</p>
    <section id="view-login" class="card" hidden>
      <div class="tabs" role="group" aria-label="Escolha">
        <button type="button" id="tab-entrar" aria-pressed="true">Entrar</button>
        <button type="button" id="tab-criar" aria-pressed="false">Criar conta</button>
      </div>
      <button type="button" id="btn-google" class="btn ghost">Entrar com Google</button>
      <div class="sep">ou com e-mail</div>
      <form id="form-email" class="form" novalidate>
        <label id="lbl-nome" hidden>Nome completo<input id="nome" autocomplete="name"></label>
        <label>E-mail<input id="email" type="email" autocomplete="email"></label>
        <label>Senha<input id="senha" type="password" autocomplete="current-password"><small id="dica" class="muted" hidden>Use pelo menos 8 caracteres.</small></label>
        <button id="btn-enviar" class="btn">Entrar</button>
      </form>
      <button type="button" id="btn-esqueci" class="link">Esqueci minha senha</button>
    </section>
    <section id="view-recovery" class="card" hidden>
      <h2>Criar nova senha</h2>
      <form id="form-recovery" class="form" novalidate>
        <label>Nova senha<input id="nova" type="password" autocomplete="new-password"><small class="muted">Use pelo menos 8 caracteres.</small></label>
        <button class="btn">Salvar nova senha</button>
      </form>
    </section>
    <p class="center"><a class="muted small" href="../">← Voltar ao site</a></p>
  </main>
</div>

<!-- Painel (depois do login) -->
<div id="shell" hidden>
  <header class="top">
    <button id="menu-btn" class="icon" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand" href="../"><img src="../assets/img/logo.png" alt="Barbearia" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'BARBEARIA'}))"></a>
    <span class="who-mini" id="who"></span>
  </header>
  <div id="scrim"></div>
  <aside id="side">
    <div class="me"><b id="who2"></b><small id="who-role"></small></div>
    <nav id="nav" aria-label="Menu principal"></nav>
    <div class="side-foot"><a class="muted small" href="../">← Voltar ao site</a><button id="logout" class="btn ghost sm">Sair</button></div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
